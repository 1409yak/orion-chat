name: Release OTA Update

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web distribution
        run: npm run build

      - name: Package bundle.zip
        run: |
          cd www
          zip -r ../bundle.zip ./*
          cd ..

      - name: Generate version.json
        run: |
          TAG_NAME="${{ github.ref_name }}"
          TAG_VERSION="${TAG_NAME#v}"
          CHECKSUM=$(sha256sum bundle.zip | awk '{print $1}')
          cat <<EOF > version.json
          {
            "version": "${TAG_VERSION}",
            "url": "https://orion-fcm-worker.gaim.workers.dev/download-ota/${TAG_NAME}/bundle.zip",
            "checksum": "${CHECKSUM}",
            "notes": "Automated update release ${TAG_NAME}"
          }
          EOF
          cat version.json

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bundle.zip
            version.json
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Automated update release ${{ github.ref_name }}"
